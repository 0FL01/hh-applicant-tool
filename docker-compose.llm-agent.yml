# Networking notes:
# - llm_agent отправляет webhook в tg_contact_collector через Docker DNS:
#   CHAT_AGENT_WEBHOOK_URL=http://tg_contact_collector:8787/webhooks/hh/recruiter-contact-offer
# - tg_contact_collector слушает на 0.0.0.0 внутри контейнера, но ports
#   привязан к 127.0.0.1 — порт 8787 доступен только с хоста (для generic webhook).
# - Оба сервиса в одной Docker Compose сети и видят друг друга по имени сервиса.

services:
  llm_agent:
    container_name: hh_llm_agent
    image: hh_llm_agent:latest
    build:
      context: .
      dockerfile: Dockerfile.llm-agent
    volumes:
      - .:/app
      # Пробрасываем таймзону хоста
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    env_file:
      - .env
    command: ["-v", "chat-agent", "--daemon"]
    environment:
      # Директория для конфигов (база данных, tokens, cookies)
      - CONFIG_DIR=/app/config
      # Смените или закомментируйте при проблемах с терминалом
      - TERM=${TERM}
      # Если время на сервере отличается от времени в контейнере
      # - TZ=Europe/Moscow
      # Для безопасного тестирования можно включить dry-run через env
      # - CHAT_AGENT_DRY_RUN=true
      # Пауза между циклами daemon-режима
      - CHAT_AGENT_POLL_INTERVAL=${CHAT_AGENT_POLL_INTERVAL:-60}

  tg_contact_collector:
    container_name: hh_tg_contact_collector
    image: hh_llm_agent:latest
    build:
      context: .
      dockerfile: Dockerfile.llm-agent
    volumes:
      - .:/app
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    env_file:
      - .env
    command: ["-v", "tg-contact-collector"]
    environment:
      - CONFIG_DIR=/app/config
      - TERM=${TERM}
      - TELEGRAM_COLLECTOR_LISTEN_HOST=${TELEGRAM_COLLECTOR_LISTEN_HOST:-0.0.0.0}
      - TELEGRAM_COLLECTOR_LISTEN_PORT=${TELEGRAM_COLLECTOR_LISTEN_PORT:-8787}
    ports:
      - "127.0.0.1:${TELEGRAM_COLLECTOR_LISTEN_PORT:-8787}:${TELEGRAM_COLLECTOR_LISTEN_PORT:-8787}"
